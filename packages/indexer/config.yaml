name: grain
description: >-
  Read accelerator for the Grain registry. The chain remains the source of
  truth -- SPEC.md 7 requires the resolver to keep working with this indexer
  down, and the fallback is demonstrated rather than claimed.

networks:
  - id: 10143 # Monad testnet
    start_block: 65176523 # the deployment block; nothing exists before it
    contracts:
      - name: GrainRegistry
        address:
          - 0x180eC6A4FaF1a081e3eE3Fb4540fd3Df6d1A4c20
        handler: src/EventHandlers.ts
        events:
          - event: ManifestRegistered(uint64 indexed recordId, address indexed creator, uint64 fingerprint, bytes32 manifestHash, bytes manifest)
          - event: ManifestSuperseded(uint64 indexed oldId, uint64 indexed newId)
          - event: ManifestRevoked(uint64 indexed recordId)

      - name: CreatorRegistry
        address:
          - 0x783159d464B15180935222b342aEDc3Cf5ff2DE7
        handler: src/EventHandlers.ts
        events:
          - event: ProfileSet(address indexed creator, string handle, uint256 licensePriceWei)

      - name: LicenseRegistry
        address:
          - 0x71260B7e406566D0fd880320b58537eE27895B1E
        handler: src/EventHandlers.ts
        events:
          - event: LicenseGranted(uint64 indexed recordId, address indexed licensee, address indexed creator, uint256 amountWei, uint40 grantedAt)
