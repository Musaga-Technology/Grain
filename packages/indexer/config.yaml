name: grain
description: >-
  The read path for the Grain registry. The chain stays the source of truth:
  every read falls back to the chain with this indexer down, and that fallback
  is demonstrated rather than claimed.

# Transaction hashes are not delivered unless requested. A record page needs
# one so a person can follow the registration to the chain themselves, which is
# the whole point of the registry being public.
field_selection:
  transaction_fields:
    - hash

# Contract shapes are declared once and attached to a chain below.
contracts:
  - name: GrainRegistry
    handler: src/EventHandlers.ts
    events:
      - event: ManifestRegistered(uint64 indexed recordId, address indexed creator, uint64 fingerprint, bytes32 manifestHash, bytes manifest)
      - event: ManifestSuperseded(uint64 indexed oldId, uint64 indexed newId)
      - event: ManifestRevoked(uint64 indexed recordId)

  - name: CreatorRegistry
    handler: src/EventHandlers.ts
    events:
      - event: ProfileSet(address indexed creator, string handle, uint256 licensePriceWei)

  - name: LicenseRegistry
    handler: src/EventHandlers.ts
    events:
      - event: LicenseGranted(uint64 indexed recordId, address indexed licensee, address indexed creator, uint256 amountWei, uint40 grantedAt)

  # Seals of the off-chain activity log. Indexed so /sealed can list each seal
  # with its transaction; the check itself still reads the root from the chain.
  - name: ActivityAnchor
    handler: src/EventHandlers.ts
    events:
      - event: Sealed(uint256 indexed index, uint64 from, uint64 until, uint32 events, bytes32 root)

chains:
  - id: 10143 # Monad testnet
    start_block: 65176523 # the deployment block; nothing exists before it
    contracts:
      - name: GrainRegistry
        address: "0x180eC6A4FaF1a081e3eE3Fb4540fd3Df6d1A4c20"
      - name: CreatorRegistry
        address: "0x783159d464B15180935222b342aEDc3Cf5ff2DE7"
      - name: LicenseRegistry
        address: "0x71260B7e406566D0fd880320b58537eE27895B1E"
      - name: ActivityAnchor
        address: "0x4F728dd37Bc38Db5C594ff17c8FC2dbc7Ed28e56"
