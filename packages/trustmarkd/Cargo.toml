[package]
name = "trustmarkd"
version = "0.1.0"
edition = "2021"
license = "MIT"

# Path dependency on the cloned Adobe crate. scripts/setup-trustmark.sh clones
# it into .tools/trustmark-src, which is gitignored because it is ~100 MB.
[dependencies]
trustmark = { path = "../../.tools/trustmark-src/rust" }
image = "0.25.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "trustmarkd"
path = "src/main.rs"
